<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App2 | Path-Based Route</title>
<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #7c2d12, #451a03);
    color: #fff7ed;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    text-align: center;
  }
  .card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 48px 56px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  }
  h1 { font-size: 2.2rem; margin-bottom: 8px; }
  p { color: #fed7aa; margin: 4px 0; }
  .badge {
    display: inline-block;
    margin-top: 20px;
    padding: 6px 14px;
    background: #9a3412;
    border-radius: 999px;
    font-size: 0.85rem;
    color: #ffedd5;
  }
  nav { margin-top: 24px; }
  nav a {
    color: #fdba74;
    text-decoration: none;
    margin: 0 10px;
    font-size: 0.95rem;
  }
  nav a:hover { text-decoration: underline; }
  #meta { margin-top: 18px; font-size: 0.8rem; color: #fdba74aa; }
</style>
</head>
<body>
  <div class="card">
    <h1>🟧 App 2</h1>
    <p>This page is served for path: <code>/app2/*</code></p>
    <p>Route it to Target Group <strong>app2-tg</strong> in your ALB listener rules.</p>
    <div class="badge">Target Group: app2-tg</div>
    <nav>
      <a href="/">Home</a> |
      <a href="/app1/">Go to /app1</a>
    </nav>
    <div id="meta"></div>
  </div>
  <script>
    document.getElementById('meta').textContent =
      'Loaded at ' + new Date().toLocaleString() + ' • ' + window.location.hostname;
  </script>
</body>
</html>
